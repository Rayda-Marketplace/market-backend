[project]
name = "identity-service"
version = "0.1.0"
description = "Identity service"
readme = "README.md"
authors = [
    { name = "Cryder", email = "cronyx.developer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.84.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvloop>=0.22.1",
]

[project.scripts]
identity-service = "identity_service:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py314"

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

ignore = [
    "E501",
]

exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    ".idea",
    "venv",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "--cov=identity_service",
    "--cov-report=term-missing",
    "-ra"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["identity_service"]
omit = [
    "*/identity_service/bootstrap/__main__.py",
    "*/identity_service/bootstrap/setup.py",
]

[tool.coverage.report]
skip_empty = true
